<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>에니어그램 상세 검사</title>
<meta name="description" content="135개 문항에 1~5점으로 답하고 가까운 에니어그램 유형을 찾아봐요.">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
  /* 강의용 상세 검사. 다른 파일 없이 이 파일 하나로 동작한다 */
  :root {
    --primary: #6553C2;
    --primary-hover: #5443AE;
    --primary-light: #9C8CE8;
    --primary-soft: #EEEAFD;
    --accent-soft: #F6F4FE;
    --text: #3A3845;
    --text-sub: #5F5B6E;
    --text-faint: #A9A5B4;
    --bg: #FFFFFF;
    --backdrop: #F8F9F9;
    --fill: #F3F3F6;
    --border: #E8E8EC;
    --border-strong: #C9C7D1;
  }
  * { box-sizing: border-box; }
  html { background: var(--backdrop); }
  body {
    margin: 0 auto;
    max-width: 616px;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard Variable", "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  main { padding: 32px 16px 64px; }
  [hidden] { display: none !important; }

  .head h1 { margin: 0 0 8px; font-size: 28px; font-weight: 700; line-height: 1.3; }
  .head p { margin: 0; font-size: 15px; color: var(--text-sub); }

  .progress { position: sticky; top: 0; z-index: 1; margin: 16px -16px 8px; padding: 12px 16px; background: var(--bg); }
  .progress-label { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-sub); margin-bottom: 8px; }
  .progress-track { height: 8px; border-radius: 999px; background: var(--fill); overflow: hidden; }
  .progress-bar { height: 100%; width: 0; background: var(--primary); border-radius: 999px; transition: width 240ms ease; }

  .q { padding: 20px 0; border-bottom: 1px solid var(--border); scroll-margin-top: 80px; }
  .q-text { margin: 0 0 12px; font-size: 16px; font-weight: 500; }
  .q-no { font-weight: 700; color: var(--primary); }
  .scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 0; padding: 0; border: 0; }
  .scale label { position: relative; cursor: pointer; }
  .scale input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .scale span {
    display: grid; place-items: center;
    height: 44px;
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 16px; font-weight: 600; color: var(--text-sub);
    transition: background 120ms, border-color 120ms;
  }
  .scale label:hover span { border-color: var(--primary-light); }
  .scale input:checked + span { background: var(--primary); border-color: var(--primary); color: #fff; }
  .scale input:focus-visible + span { outline: 2px solid var(--primary-light); outline-offset: 2px; }
  .scale-ends { display: flex; justify-content: space-between; margin-top: 6px; font-size: 13px; color: var(--text-sub); }

  .nav { display: flex; gap: 8px; margin-top: 24px; }
  .btn {
    display: block; width: 100%;
    padding: 16px;
    border: 0; border-radius: 999px;
    font: inherit; font-size: 16px; font-weight: 600;
    cursor: pointer; text-align: center; text-decoration: none;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-primary:disabled { background: var(--border); color: var(--text-faint); cursor: default; }
  .btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--primary-light); }
  .nav .btn-secondary { flex: 0 0 35%; }
  .btn:focus-visible { outline: 2px solid var(--primary-light); outline-offset: 2px; }
  .nav-note { margin: 8px 0 0; text-align: center; font-size: 13px; color: var(--text-sub); }

  .result-top { text-align: center; padding: 16px 0 24px; }
  .result-badge {
    width: 72px; height: 72px; margin: 0 auto 12px;
    display: grid; place-items: center;
    border-radius: 999px;
    background: var(--primary-soft); color: var(--primary);
    font-size: 32px; font-weight: 700;
  }
  .result-kicker { margin: 0; font-size: 15px; color: var(--text-sub); }
  .result-top h2 { margin: 4px 0 8px; font-size: 28px; font-weight: 700; line-height: 1.3; }
  .result-desc { margin: 0; font-size: 16px; }
  .wing { margin: 16px auto 0; padding: 12px 16px; border-radius: 12px; background: var(--accent-soft); text-align: left; }
  .wing b { display: block; font-size: 16px; font-weight: 700; color: var(--primary); }
  .wing span { display: block; margin-top: 2px; font-size: 13px; color: var(--text-sub); }
  .top3 { margin: 0 0 24px; padding: 16px; border: 1px solid var(--border); border-radius: 20px; }
  .top3 h3 { margin: 0 0 4px; font-size: 18px; font-weight: 700; }
  .top3 > p { margin: 0 0 8px; font-size: 13px; color: var(--text-sub); }
  .top3 ol { margin: 0; padding: 0; list-style: none; }
  .top3 li { display: flex; gap: 12px; align-items: baseline; padding: 12px 0; border-top: 1px solid var(--border); }
  .top3-no { flex: none; width: 40px; font-size: 13px; font-weight: 700; color: var(--text-sub); }
  .top3 li:first-child .top3-no { color: var(--primary); }
  .top3 b { display: block; font-size: 16px; font-weight: 600; }
  .top3 span.top3-desc { display: block; font-size: 13px; color: var(--text-sub); }
  .result-note { margin: 0 0 32px; padding: 16px; border-radius: 12px; background: var(--fill); font-size: 15px; color: var(--text-sub); }
  .result .btn-secondary { margin-top: 12px; }
</style>
</head>
<body>
<main>
  <section id="test">
    <header class="head">
      <h1>에니어그램 상세 검사</h1>
      <p>문장마다 나와 가까운 정도를 1~5점으로 골라주세요. 1은 전혀 그렇지 않다, 5는 매우 그렇다예요. 답은 이 기기에 저장돼서 중간에 닫아도 이어서 할 수 있어요.</p>
    </header>

    <div class="progress" aria-hidden="true">
      <div class="progress-label"><span id="page-text"></span><span id="progress-text"></span></div>
      <div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div>
    </div>

    <div id="questions"></div>

    <div class="nav">
      <button type="button" class="btn btn-secondary" id="prev">이전</button>
      <button type="button" class="btn btn-primary" id="next"></button>
    </div>
    <p class="nav-note" id="nav-note">이 페이지 문항에 모두 답하면 넘어갈 수 있어요.</p>
  </section>

  <section class="result" id="result" hidden aria-live="polite">
    <div class="result-top">
      <div class="result-badge" id="result-badge"></div>
      <p class="result-kicker">가장 가까운 유형</p>
      <h2 id="result-title"></h2>
      <p class="result-desc" id="result-desc"></p>
      <div class="wing"><b id="wing-title"></b><span id="wing-detail"></span></div>
    </div>
    <div class="top3">
      <h3>예상 유형 순위</h3>
      <p>2·3순위는 1순위와 헷갈릴 수 있는 유형이에요. 설명을 읽고 더 와닿는 쪽을 찾아보세요.</p>
      <ol id="top3"></ol>
    </div>

    <p class="result-note">이 결과는 정답이 아니라 나를 살펴보는 단서예요. 행동보다 ‘왜 그렇게 했는지’가 나와 맞는지 확인해보세요.</p>
    <button type="button" class="btn btn-primary" id="retry">처음부터 다시 하기</button>
    <a class="btn btn-secondary" href="survey.html">간단 설문지로 돌아가기</a>
  </section>
</main>

<script>
(function () {
  // 유형별 15문항 × 9유형 = 135문항. 화면에는 섞어서 보여준다
  var DATA = {"1":["대부분의 사람들은 나를 진지하고 융통성 없는 사람이라고 생각한다. 실제로 나는 그런 사람이다.","나는 항상 내 자신에 대해서 정직하고 객관적이려고 노력한다. 그리고 어떤 대가를 치르든지 내 양심에 따라서 행동한다.","나에게는 거친 부분이 있기는 하지만 그것이 나의 전체적인 성향을 대변해 주는 말은 아니다.","내 머릿속에는 심판관이 있어서 나는 그와 함께 살고 있는 것 같다. 어떤 때는 그 심판관이 현명하고 분별력이 있지만 많은 경우에 그는 고집이 세고 가혹하다.","나는 완벽해지기 위해서 많은 대가를 치른다고 느낀다.","나도 남들처럼 웃기를 좋아한다. 사실 나는 더 자주 웃어야 한다.","나의 원칙과 이상은 더 큰 성취를 위해서 노력하도록 나를 고무한다. 그리고 그것은 나의 삶을 의미 있고 가치 있는 것으로 만든다.","나는 왜 많은 사람들이 낮은 성취동기를 가지고 있는지 이해하지 못하겠다.","나는 많은 책임을 지고 있기 때문에 다른 사람보다 더 조직적이고 체계적이어야 한다.","나는 사명감을 가지고 있다. 나에게는 중대한 소명이 주어졌다. 나는 뭔가 뛰어난 업적을 남겨야 한다고 믿는다.","나는 실수하는 것을 아주 싫어한다. 그래서 모든 것이 제대로 되게 하기 위해서 아주 철저하게 일을 하려고 한다.","대체로 나는 옳은 것은 옳은 것이고 틀린 것은 틀린 것이라고 믿는다.","나는 다른 사람에게 일을 맡겼을 때 간섭하지 않고 그대로 내버려 두기가 어렵다.","나에게는 많은 책임이 주어졌다. 내가 어려운 시기에 잘 대처하지 않았다면 무슨 일이 벌어졌을지 아무도 모른다.","나는 어려운 상황 속에서도 인간의 도리와 자신이 믿는 가치를 포기하지 않는 사람을 볼 때 깊은 감동을 받는다."],"2":["나는 사람에 대해서 순수한 관심을 갖기 때문에 남들의 희망, 꿈, 필요를 잘 이해하고 있다.","사람들에게 친숙한 느낌을 갖는 것은 내게는 아주 자연스럽다. 나는 쉽게 사람들과 대화를 하고 친밀하게 지낸다.","내가 사람들에게 관심을 보이고 격려할 때 그들은 나를 따뜻하게 대해 준다.","나는 길 잃은 개를 보면 집에 데려다 주고 싶은 생각이 든다.","나는 내가 사려 깊고 너그러운 사람이라는 것이 기쁘다.","나는 사람들을 위해 많은 일을 한 것에 대해서 공치사 하기를 좋아하지 않는다. 그러나 사람들이 그것을 알아차리지 못하고 무신경할 때 나는 큰 실망을 느낀다.","나는 자신보다 다른 사람을 위해 더 많은 일을 한다. 나는 남에게는 너무 많이 주고 자신에 대해서는 충분히 배려하지 않는다.","나는 사람들이 내 편이 되도록 하기 위해서 노력할 때가 있다. 특히 처음에 나에게 무관심한 것 같은 사람들에게는 그렇다.","나는 친구나 친지들을 즐겁게 해주고 대접하는 것에서 각별한 보람을 느낀다.","나는 따뜻하고 사람들에게 도움을 주는 사람이다. 그러나 나에게는 다른 사람이 생각하지 못하는 차가운 면이 있다.","나는 다른 사람들보다 나의 감정을 잘 표현할 수 있다.","나는 내가 아끼는 사람들에게 무슨 일이 일어나는지 알기 위해 각별한 노력을 기울인다.","나는 스스로를 '낙심한 사람을 치유해 주는 사람'이라고 생각한다.","나는 나 자신보다는 다른 사람의 필요를 먼저 생각하기 때문에 건강과 재정적인 면에서 어려움을 겪고 있다.","나는 다른 사람들을 돌보느라고 기진맥진해질 때가 있다."],"3":["나는 스스로를 자신감 있는 사람이라고 여긴다. 어떤 일을 효율적으로 못했을 때 나는 마음이 불편하다.","어떤 일이 잘 풀려 나갈 때 나는 자신의 삶에 대해서 만족을 느끼며, 내면에서 기쁨이 '솟아나는' 것을 느낀다.","나는 다른 사람들에게 나의 가장 좋은 모습을 보이려고 노력한다.","나는 자신의 감정에 대해서 익숙하지 않다. 잠깐 동안은 감정을 강하게 느끼지만 곧 다른 일에 몰두한다.","내가 원하는 성공을 아직 이루지 못했다고 해도, 내가 잘 해 나가고 있다는 것을 느끼는 것은 나에게 아주 중요하다.","나는 불안감을 감추는 데 아주 능숙하다. 사람들은 내가 정말로 무엇을 느끼는지 모를 것이다.","나는 사람들에게 좋은 인상을 주려고 노력한다. 그래서 나는 예의바르고 친절하게 행동한다.","나는 내 친구나 동료들이 어떻게 해 나가고 있는지를 알고 있다. 나는 그들과 나를 자주 비교한다.","나는 맡은 일에서 최선을 다하려고 노력한다. 하지만 어떤 일을 뛰어나게 잘 하지 못했다고 해서 그 사실이 나를 괴롭히지는 않는다.","나는 목표를 이루기 위해서 원칙을 무시하고 빨리 가는 길을 택할 때가 있다.","나는 불안할 때 사람들을 냉정하게 대하고 사람들에게서 떨어져 있다.","다른 사람들이 내가 이룬 일을 인정하지 않을 때 마음이 아주 불편하다.","나는 보통사람보다 적응을 더 잘 한다. 나는 일이 잘 풀리지 않을 때 어떻게 행동을 바꾸면 내가 원하는 결과를 얻을 지 안다.","나는 항상 목표에 초점을 맞춘다. 그리고 그것을 이루기 위해 나 자신에게 어떻게 동기 부여를 해야 하는지를 안다.","나는 일 중독에 빠지는 경향이 있다. 어떤 일을 성취하고 있지 않으면 마음이 불안하다."],"4":["많은 사람이 나를 알기 어렵고 모순된 면을 갖고 있는 사람이라고 생각한다. 그리고 나는 나의 그런 면이 좋다.","나는 부정적인 감정이 있을 때 오랫동안 그것을 품고 있는 경향이 있다.","나는 자신이 혼자이며 외롭다고 느낄 때가 많다. 가까운 사람과 함께 있을 때도 그렇다.","사람들이 나를 비판하거나 제대로 이해하지 못할 때 나는 움츠러들고 혼자서 뾰로통해 있다.","어떤 프로젝트에 임할 때, 내가 창조적인 아이디어를 낼 수 있고 그것이 잘 받아들여지는 상황이 아니라면 그 일에 전념하기가 어렵다.","나는 규칙이나 다른 사람의 기대에 잘 따르지 않는 경향이 있다. 나만의 특별한 감각으로 모든 일을 하기를 원하기 때문이다.","나는 감정의 변화가 많다.","나는 별로 일어날 가망이 없는 일을 상상할 때가 많다.","나는 누군가가 나를 구원하여 모든 혼란스러운 상황에서 벗어나게 되기를 꿈꾼다.","상황이 어려워지면 나는 힘없이 무너지고 포기하는 경향이 있다. 나는 너무 쉽게 포기하는 것 같다.","나는 형편없는 취향을 가진 사람과 함께 있을 때 견디기가 어렵다.","대개의 경우 나는 다른 사람과 너무 가까이 지내며 함께 일하는 것을 좋아하지 않는다.","나는 자신에게 집중하며 자신의 감정적 필요를 충족시키는 것을 아주 중요하게 생각한다.","나는 남 앞에 서는 것도, 남의 의견에 무작정 따르는 것도 좋아하지 않는다.","나는 내 직관에 따르든지 않든지 내가 직관적으로 느끼는 것이 무엇인지 정확하게 알고 있다."],"5":["나는 어떤 문제에 대해서 깊이 파고들기를 좋아한다. 그래서 가능한 한 완전히 그것에 대해 알아낸다.","나는 많은 사람들이 나의 세계로 들어오는 것을 허용하지 않는 극단적으로 사적인 사람이다.","나는 스스로가 그리 크거나 강한 사람이라고 느껴지지 않는다. 오히려 작고 눈에 띄지 않는 사람이라고 여겨진다. 내가 스파이가 된다면 그 일을 잘 해낼 것이다!","내가 대부분의 시간에 무엇을 생각하는지 안다면 사람들은 내가 미쳤다고 생각할 것이다.","나는 정보를 얻어야만 이성적인 결정을 내릴 수 있다고 생각한다. 그런데 대부분의 사람들은 그리 이성적이지 않다.","가족들은 내가 좀 이상하고 특이하다고 생각한다. 그들은 나에게 밖으로 좀 더 많이 나가야 한다고 이야기한다.","나도 필요하다면 의견을 말할 수 있다. 그러나 대개는 주변에서 일어나는 일들을 지켜보는 것을 더 좋아한다.","나는 문제를 해결해야 할 상황에서는 혼자 일하는 것을 더 좋아한다.","나를 잘 살펴본다면 이상한 행동보다는 정상적인 행동을 더 많이 발견할 것이다.","나는 맡은 프로젝트를 다루는 데 많은 시간을 보내는 경향이 있다.","대부분의 사람들은 아주 무지하다. 그런데도 일이 이루어지는 것은 정말 놀라운 일이다.","나는 여러 분야에 대해서 많은 것을 알고 있다. 그리고 몇몇 분야에 대해서는 전문가 수준이다.","나는 호기심이 많으며, 어떤 일이든 왜 그런 방식으로 이루어지는지 탐구하기를 좋아한다. 나는 극히 단순하고 뻔한 것들도 아주 자세히 들여다본다.","나의 생각은 격렬하고 활동적이다.","때때로 나는 하고 있는 일에 너무 열중해서 시간을 잊어버린다."],"6":["나는 권위에 끌리지만 권위를 별로 신뢰하지는 않는다.","나는 아주 감정적이다. 그러나 아주 친한 사람이 아니면 내가 느끼는 것을 거의 드러내지 않는다. 친한 사람에게도 별로 감정을 보여 주지 않는다.","내가 실수를 했을 때 모든 사람이 나를 공격할까 봐 두렵다.","나는 스스로 결정을 내려서 일을 하는 것보다는, 사람들이 내게 기대하는 일을 하는 게 더 편하게 느껴진다.","나는 항상 규칙에 동의하거나 규칙을 따르지는 않는다. 그러나 나는 규칙을 잘 알기를 원한다.","나는 사람들에 대해 내가 가졌던 첫 인상을 바꾸기가 어렵다.","내가 존경하는 인물이 몇 명 있다. 그들은 나의 영웅이다.","나는 결정을 내리는 것을 좋아하지 않는다. 그러나 다른 사람이 내 일을 결정해 주는 것도 좋아하지 않는다.","사람들은 내가 좀 초조하고 예민하다고 생각하지만, 나는 그들이 생각하는 것 이상으로 초조하며 예민하다.","나는 자신이 얼마나 엉망인지를 알고 있다. 그래서 다른 사람이 하는 일에 대해서도 의심을 품을 때가 많다.","나는 사람들을 신뢰하고 싶다. 그러나 다른 사람들의 동기가 의심스러울 때가 많다.","나는 정말로 열심히 일한다. 나는 일이 끝날 때까지 쉬지 않고 계속 일한다.","나는 결정을 내리기 전에 내가 신뢰하는 사람들의 의견을 들어 본다.","나는 모든 일에 대해 회의적이며 냉소적이기까지 하다. 하지만 그러다가도 태도를 완전히 바꾸어 어떤 것에 완전히 몰입해 버리기도 한다. 나 스스로도 이러한 면이 아주 이상하게 느껴진다.","나는 불안해 할 때가 아주 많다."],"7":["나는 여행하는 것, 여러 가지 음식을 맛보는 것, 사람들을 만나는 경험을 좋아한다. 그런 것을 할 때 나는 삶이 아주 근사하게 느껴진다.","내 달력은 계획으로 가득 차 있다. 나는 이렇게 바쁘게 지내는 것이 좋다.","나에게 중요한 것은 편안함과 안전보다는 흥미진진함과 다양성이다.","내 마음 속에는 항상 여러 가지 생각이 있다. 어떤 때는 동시에 열 가지를 생각하는 것 같다.","내가 가장 견딜 수 없는 것은 지루함이다. 나는 결코 지루한 적이 없다.","나는 어떤 사람과 관계를 맺고 있을 때 상대에게 꽤 충실한 편이다. 그러나 그 관계가 끝나면 곧 잊어버린다.","나는 호기심과 모험심이 많다. 그래서 무엇이든지 흥미롭고 새로운 것을 시도하기를 좋아한다.","나는 어떤 일이 더 이상 재미있게 느껴지지 않으면 그 일을 그만둬 버린다.","나는 단지 '재미있는' 사람은 아니다. 별로 달갑지는 않지만 나에게도 심각하고 어두운 면이 있다.","나는 차근차근 실천을 하기보다는 전체적인 계획을 세우는 것을 더 잘 한다. 예를 들어 '각자가 창조적인 아이디어를 내놓는 회의를 하는 것'이 그 아이디어를 실제로 적용하는 것보다 더 재미있다.","내가 뭔가를 정말로 원할 때는 그것을 손에 넣을 수 있는 방법을 찾는다.","나도 이따금 실망에 빠질 때가 있다. 그러나 곧 그런 기분에서 벗어난다.","내가 가진 문제 중의 하나는 너무 산만하고 집중을 못한다는 것이다.","나는 내 형편에 맞지 않게 돈을 너무 많이 쓴다.","내가 가는 곳을 사람들이 기꺼이 따라와 준다면 나는 사람들과 같이 다니는 것이 좋다."],"8":["나는 아주 독립적이다. 나는 남에게 의존하는 것을 좋아하지 않는다.","나는 뭔가를 이루려면 희생이 뒤따라야 한다고 생각한다.","내가 누군가에게 관심을 가지게 되면, 그들을 '나의 사람들'이라고 느낀다. 그래서 그들을 돌봐 주어야 한다고 느낀다.","나는 어떻게 결과에 도달할 수 있는지 알고 있다. 어떻게 사람들을 격려하고 어떻게 일을 하도록 압력을 가해야 하는지도 알고 있다.","나는 약하고 우유부단한 사람들에 대한 동정심이 별로 없다. 약함은 문제를 일으킬 뿐이다.","나는 의지가 강한 사람이다. 그래서 쉽게 포기하거나 주저앉지 않는다.","내 영향력 아래에 있고 내가 감싸 주던 사람이 독립적으로 자기 일을 해 나갈 때 나는 아주 긴장을 하고 그를 지켜본다.","나에게도 부드럽고 감상적인 면이 있지만 아주 소수의 사람들에게만 그런 모습을 보여 준다.","나를 아는 사람들은 내가 직선적으로 마음을 표현하는 것을 좋아한다.","나는 내가 누리는 모든 것을 위해 열심히 일한다. 그리고 나는 어떤 일을 어렵게 이루는 것이 좋다고 느낀다. 이것이 나를 강하게 만들며 내가 원하는 것이 무엇인지 분명하게 알도록 해 주기 때문이다.","나는 스스로가 도전자라고 생각한다. 나는 사람들을 밀어붙여서 그들이 최선을 다하도록 한다.","나의 유머 감각은 현실적이다. 때로는 그것이 거칠기도 하다. 나는 대부분의 사람들이 너무 소심하고 심약하다고 생각한다.","나는 크게 화를 낼 때가 있다. 그러나 곧 가라앉는다.","나는 다른 사람들이 불가능하다고 느끼는 일을 할 때 가장 많은 힘을 얻는다. 나는 내가 할 수 있는 극한까지 가서 그것을 이룰 수 있는지 보고 싶다.","어떤 상황에서는 누군가가 손해를 봐야 한다. 그렇지만 나는 그것이 내가 아니었으면 좋겠다."],"9":["나와 있으면 안전하다고 느끼기 때문에 사람들이 나를 좋아하는 것 같다.","나는 혼자 있을 때도 괜찮고 사람들과 어울려 있을 때도 괜찮다. 내 마음만 편안하다면 어느 쪽도 괜찮다.","나는 삶에서 균형을 찾았다. 그리고 나에게는 그 상태를 깰 이유가 없다.","모든 면에서 '편안해진다'는 것은 나에게 많은 의미가 있다.","나는 앞에 나서는 것을 좋아하지 않는다.","나는 내 뜻대로 조작하기보다는 일이 흘러가는 대로 내버려 두는 편이다.","나는 쉽게 만족하는 편이다. 나는 내가 갖고 있는 것이 충분하다고 여긴다.","나는 주의가 산만하며 멍하다는 이야기를 듣는다. 사실 나는 상황을 잘 이해하지만 그것에 반응하는 것을 좋아하지 않는다.","내가 특별히 고집이 세다고는 생각하지 않는다. 그러나 사람들은 내가 일단 마음 먹으면 누구의 말도 듣지 않는다고 말한다.","대부분의 사람들은 쉽게 흥분한다. 그러나 나는 안정되고 침착한 편이다.","우리는 삶에서 일어나는 일을 그저 받아들여야만 한다. 거기에 대해서 별로 할 수 있는 일이 없기 때문이다.","나는 다른 사람의 관점을 쉽게 이해할 수 있다. 나는 사람들에게 동의하지 않을 때보다는 동의할 때가 더 많다.","나는 부정적인 것에 머물기보다는 긍정적인 것을 강조한다.","나는 어려울 때 지침을 주고 많은 위안을 주는 삶의 철학을 가지고 있다.","나는 낮 시간에는 필요한 모든 일을 한다. 그러나 밤이 되면 어떻게 긴장을 풀고 쉬어야 할지를 모른다."]};

  var PER_PAGE = 15;
  var STORE = 'enneagram-detail-test-v2';

  var ALL = [];
  Object.keys(DATA).forEach(function (t) {
    DATA[t].forEach(function (text, i) { ALL.push({ id: t + '-' + (i + 1), type: Number(t), text: text }); });
  });
  var BY_ID = {};
  ALL.forEach(function (q) { BY_ID[q.id] = q; });

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function mixedOrder() {
    var pools = {};
    Object.keys(DATA).forEach(function (t) {
      pools[t] = shuffle(ALL.filter(function (q) { return String(q.type) === t; }).map(function (q) { return q.id; }));
    });
    var order = [];
    var last = null;
    for (var round = 0; round < 15; round++) {
      var types = shuffle(Object.keys(pools));
      if (types[0] === last) types.push(types.shift());
      types.forEach(function (t) { order.push(pools[t].pop()); });
      last = types[types.length - 1];
    }
    return order;
  }

  function fresh() {
    return { order: mixedOrder(), answers: {}, page: 0, done: false };
  }

  // 저장된 진행 상황 (문항 순서·답·페이지). 못 읽으면 새로 시작
  var state = null;
  try {
    var saved = JSON.parse(localStorage.getItem(STORE));
    if (saved && saved.order && saved.order.length === ALL.length && saved.order.every(function (id) { return BY_ID[id]; })) state = saved;
  } catch (e) {}
  if (!state) state = fresh();

  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {}
  }

  var prev = document.getElementById('prev');
  var next = document.getElementById('next');
  var navNote = document.getElementById('nav-note');

  function pageIds() {
    return state.order.slice(state.page * PER_PAGE, (state.page + 1) * PER_PAGE);
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function renderPage() {
    var start = state.page * PER_PAGE;
    box.innerHTML = pageIds().map(function (id, i) {
      var q = BY_ID[id];
      var n = start + i;
      var picked = state.answers[id];
      var scale = [1, 2, 3, 4, 5].map(function (v) {
        return '<label><input type="radio" name="q' + n + '" value="' + v + '"' + (picked === v ? ' checked' : '') + ' aria-label="' + v + '점"><span>' + v + '</span></label>';
      }).join('');
      return '<div class="q" id="q' + n + '">' +
        '<p class="q-text"><span class="q-no">' + (n + 1) + '.</span> ' + esc(q.text) + '</p>' +
        '<fieldset class="scale">' + scale + '</fieldset>' +
        '<div class="scale-ends"><span>전혀 그렇지 않다</span><span>매우 그렇다</span></div>' +
        '</div>';
    }).join('');
    document.getElementById('page-text').textContent = (state.page + 1) + ' / ' + pages + ' 페이지';
    prev.hidden = state.page === 0;
    next.textContent = state.page === pages - 1 ? '결과 보기' : '다음';
    updateProgress();
  }

  function updateProgress() {
    var n = Object.keys(state.answers).length;
    document.getElementById('progress-text').textContent = n + ' / ' + ALL.length + '문항';
    document.getElementById('progress-bar').style.width = (n / ALL.length * 100) + '%';
    var pageDone = pageIds().every(function (id) { return state.answers[id]; });
    next.disabled = !pageDone;
    navNote.hidden = pageDone;
  }

  box.addEventListener('change', function (e) {
    var id = state.order[Number(e.target.name.slice(1))];
    state.answers[id] = Number(e.target.value);
    save();
    updateProgress();
    // 다음 안 푼 문항으로 내려간다
    var ids = pageIds();
    var rest = ids.slice(ids.indexOf(id) + 1).filter(function (x) { return !state.answers[x]; });
    if (rest.length) document.getElementById('q' + state.order.indexOf(rest[0])).scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  prev.addEventListener('click', function () {
    state.page--;
    save();
    renderPage();
    window.scrollTo(0, 0);
  });

  next.addEventListener('click', function () {
    if (state.page < pages - 1) {
      state.page++;
      save();
      renderPage();
      window.scrollTo(0, 0);
    } else {
      state.done = true;
      save();
      showResult();
    }
  });

  function showResult() {
    var score = {};
    for (var t = 1; t <= 9; t++) score[t] = 0;
    Object.keys(state.answers).forEach(function (id) { score[BY_ID[id].type] += state.answers[id]; });
    var best = Math.max.apply(null, Object.keys(score).map(function (t) { return score[t]; }));
    var tops = Object.keys(score).filter(function (t) { return score[t] === best; }).map(Number);
    var top = tops[0];

    document.getElementById('result-badge').textContent = top;
    document.getElementById('result-title').textContent = tops.length > 1
      ? tops.map(function (t) { return t + '번'; }).join(' · ') + '에 가까워요'
      : top + '번 ' + TYPES[top].name + '에 가까워요';
    document.getElementById('result-desc').textContent = tops.length > 1
      ? '점수가 같은 유형이 있어요: ' + tops.map(function (t) { return t + '번 ' + TYPES[t].name; }).join(', ')
      : TYPES[top].desc;

    var ranked = Object.keys(score).map(function (t) { return { type: Number(t), score: score[t] }; })
      .sort(function (a, b) { return b.score - a.score || a.type - b.type; });
    ranked.forEach(function (it, i) { it.rank = i > 0 && it.score === ranked[i - 1].score ? ranked[i - 1].rank : i + 1; });
    // 1~3순위 (점수가 같으면 같은 순위)
    document.getElementById('top3').innerHTML = ranked.slice(0, 3).map(function (it) {
      return '<li><span class="top3-no">' + it.rank + '순위</span><div><b>' + it.type + '번 ' + TYPES[it.type].name + '</b>' +
        '<span class="top3-desc">' + TYPES[it.type].desc + '</span></div></li>';
    }).join('');

    // 날개 추정: 1순위 유형 양옆(원에서 이웃한 두 유형) 중 점수가 높은 쪽. 차이가 작으면 양쪽이 비슷하다고 알려준다
    var WING_GAP = 3;
    var left = top === 1 ? 9 : top - 1;
    var right = top === 9 ? 1 : top + 1;
    var gap = Math.abs(score[left] - score[right]);
    var wing = score[left] >= score[right] ? left : right;
    document.getElementById('wing-title').textContent = gap <= WING_GAP
      ? '날개: ' + left + '번과 ' + right + '번이 비슷해요'
      : '날개: ' + wing + '번 ' + TYPES[wing].name + ' 쪽 (' + top + 'w' + wing + ')';
    document.getElementById('wing-detail').textContent =
      top + '번 양옆 유형의 점수 · ' + left + '번 ' + score[left] + '점, ' + right + '번 ' + score[right] + '점 (추정이에요)';

    document.getElementById('test').hidden = true;
    document.getElementById('result').hidden = false;
    window.scrollTo(0, 0);
  }

  document.getElementById('retry').addEventListener('click', function () {
    state = fresh();
    save();
    document.getElementById('result').hidden = true;
    document.getElementById('test').hidden = false;
    renderPage();
    window.scrollTo(0, 0);
  });

  renderPage();
  if (state.done) showResult();
})();
</script>
</body>
</html>
